server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: appointments-service
              uri: http://localhost:8081
              predicates:
                - Path=/appointments,/appointments/**

            - id: patients-service
              uri: http://localhost:8000
              predicates:
                - Path=/patients,/patients/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG